<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeDark" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2734"/>
      <stop offset="65%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark circular badge background matching provided brand icon -->
  <circle cx="256" cy="256" r="246" fill="url(#badgeDark)" filter="url(#badgeShadow)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Logo Graphics: Mint Teal #2dd4bf -->
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round" stroke-linejoin="round">
    <!-- Map Pin Outer Loop and Bottom Tip -->
    <path
      d="
        M 342 196
        A 110 110 0 1 0 156 244
        C 156 288 196 338 256 408
        C 304 352 342 308 350 274
      "
      stroke-width="26"
    />

    <!-- Verification Checkmark -->
    <path
      d="M 276 256 L 306 288 L 366 226"
      stroke-width="26"
    />
  </g>

  <!-- Solid Bottom Pin Point Tip Fill -->
  <path
    d="M 218 358 L 256 403 L 294 358 C 278 372 234 372 218 358 Z"
    fill="#2dd4bf"
  />

  <!-- Cloche Top Knob -->
  <circle cx="256" cy="184" r="14" fill="#2dd4bf"/>

  <!-- Cloche Dome (Food Platter Cover) -->
  <path
    d="M 198 240 A 58 58 0 0 1 314 240 Z"
    fill="#2dd4bf"
  />

  <!-- Cloche Serving Tray / Rim Base -->
  <rect x="190" y="248" width="86" height="16" rx="8" fill="#2dd4bf"/>
</svg>
